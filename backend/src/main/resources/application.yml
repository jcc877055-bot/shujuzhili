spring:
  application:
    name: datagov-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/soft_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
      use-big-integer-for-ints: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,materials
app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
  materials-dir: ${MATERIALS_DIR:./var/materials}
  candidate:
    session-ttl: ${SESSION_TTL:2h}
    idempotency-retention: ${IDEMPOTENCY_TTL:24h}
  extensions:
    automated-detection: false
    submitted-dataset-detection: true
    engine-review: false
    transfer-approval: false
    audit-export: false
